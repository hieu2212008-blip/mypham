<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mỹ Phẩm Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>MỸ PHẨM ONLINE</h1>
    <div class="cart-icon">
        🛒 <span id="cart-count">0</span>
    </div>
</header>

<div class="container">

    <div class="product">
        <img src="images/son.jpg">
        <h3>Son môi cao cấp</h3>
        <p class="price">280.000đ</p>
        <button onclick="addToCart('Son môi cao cấp',280000)">Thêm vào giỏ</button>
    </div>

    <div class="product">
        <img src="images/sua-rua-mat.jpg">
        <h3>Sữa rửa mặt</h3>
        <p class="price">180.000đ</p>
        <button onclick="addToCart('Sữa rửa mặt',180000)">Thêm vào giỏ</button>
    </div>

    <div class="product">
        <img src="images/kem-duong.jpg">
        <h3>Kem dưỡng da</h3>
        <p class="price">350.000đ</p>
        <button onclick="addToCart('Kem dưỡng da',350000)">Thêm vào giỏ</button>
    </div>

    <div class="product">
        <img src="images/nuoc-hoa.jpg">
        <h3>Nước hoa nữ</h3>
        <p class="price">1.300.000đ</p>
        <button onclick="addToCart('Nước hoa nữ',950000)">Thêm vào giỏ</button>
    </div>

    <div class="product">
        <img src="images/phan-nuoc.jpg">
        <h3>Phấn nước Cushion</h3>
        <p class="price">420.000đ</p>
        <button onclick="addToCart('Phấn nước Cushion',420000)">Thêm vào giỏ</button>
    </div>

    <div class="product">
    <img src="images/kem-nen.jpg">
    <h3>Kem nền trang điểm</h3>
    <p class="price">390.000đ</p>
    <button onclick="addToCart('Kem nền trang điểm',390000)">Thêm vào giỏ</button>
</div>

<div class="product">
    <img src="images/chuot-mi.jpg">
    <h3>Chuốt mi cong dài</h3>
    <p class="price">220.000đ</p>
    <button onclick="addToCart('Chuốt mi cong dài',220000)">Thêm vào giỏ</button>
</div>

<div class="product">
    <img src="images/phan-phu.jpg">
    <h3>Phấn phủ mịn da</h3>
    <p class="price">310.000đ</p>
    <button onclick="addToCart('Phấn phủ mịn da',310000)">Thêm vào giỏ</button>
</div>


</div>

<div class="cart-box">
    <h2>🛒 Giỏ hàng</h2>
    <ul id="cart-list"></ul>
    <p class="total">Tổng tiền: <span id="total">0</span> đ</p>
</div>

<script src="script.js"></script>
</body>
</html>
